services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/inbox.sqlite
    volumes:
      - inbox:/data
    ports:
      - "127.0.0.1:8765:8765"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  telegram:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/inbox.sqlite
    command: [python, telegram_worker.py]
    volumes:
      - inbox:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  inbox:
